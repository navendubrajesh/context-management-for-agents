name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate skills catalog
        run: python docs/scripts/generate_skills_catalog.py

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Trigger portfolio docs sync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "PORTFOLIO_DISPATCH_TOKEN not set; docs sync via portfolio schedule or manual workflow."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            https://api.github.com/repos/navendubrajesh/navendubrajesh.github.io/dispatches \
            -d '{"event_type":"sync-cmfa-docs"}'

      - name: Note on deployment
        run: |
          echo "Docs publish to https://navendubrajesh.github.io/context-management-for-agents/"
          echo "via navendubrajesh.github.io/.github/workflows/sync-cmfa-docs.yml"
