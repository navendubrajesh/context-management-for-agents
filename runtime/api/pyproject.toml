[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-skills-api"
version = "1.0.0"
description = "REST API for context-management-for-agents runtime."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "context-skills-core",
    "context-iam",
    "context-tenancy",
    "context-policy",
    "context-audit",
    "context-finops",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
context-skills-api = "main:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
