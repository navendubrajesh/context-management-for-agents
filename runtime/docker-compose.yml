services:
  api:
    build:
      context: ..
      dockerfile: runtime/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      OTEL_SERVICE_NAME: context-skills-api
      OTEL_TRACES_EXPORTER: console
      CONTEXT_SKILLS_LLM_PROVIDER: offline
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp:
    build:
      context: ..
      dockerfile: runtime/Dockerfile.mcp
    stdin_open: true
    tty: true
    environment:
      CONTEXT_SKILLS_LLM_PROVIDER: offline
