services:
  api:
    build:
      context: ..
      dockerfile: runtime/Dockerfile.api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp:
    build:
      context: ..
      dockerfile: runtime/Dockerfile.mcp
    stdin_open: true
    tty: true
