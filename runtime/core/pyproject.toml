[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-skills-core"
version = "1.0.0"
description = "Shared skill loader, manifest validator, and lexical router for context-management-for-agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["context_skills*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
