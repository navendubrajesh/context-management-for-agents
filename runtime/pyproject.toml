[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-skills-runtime-dev"
version = "1.0.0"
description = "Development meta-package for context-management-for-agents runtime."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "context-skills-core",
    "context-skills-api",
    "context-skills-sdk",
    "pytest>=7.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core", "api", "sdk-python"]
