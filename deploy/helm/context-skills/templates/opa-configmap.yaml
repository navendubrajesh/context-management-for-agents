{{- if .Values.opa.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "context-skills.fullname" . }}-opa-policy
  labels:
    {{- include "context-skills.labels" . | nindent 4 }}
data:
  contextskills.rego: |
    package contextskills

    default allow = false

    allow {
      input.rbac_allowed == true
      not skill_denied
      not model_denied
    }

    skill_denied {
      input.skill != ""
      input.skill == input.denied_skills[_]
    }

    model_denied {
      input.model != ""
      input.model == input.denied_models[_]
    }

    require_approval {
      input.operation == "skills:publish"
    }

    require_approval {
      input.operation == "tenants:manage"
    }
{{- end }}
