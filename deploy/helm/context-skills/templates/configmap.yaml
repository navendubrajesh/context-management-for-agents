apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "context-skills.fullname" . }}-config
  labels:
    {{- include "context-skills.labels" . | nindent 4 }}
data:
  CONTEXT_SKILLS_AUTH_MODE: {{ .Values.auth.mode | quote }}
  CONTEXT_SKILLS_REGION: {{ .Values.region | quote }}
  CONTEXT_SKILLS_DEPLOYMENT_MODE: {{ .Values.deploymentMode | quote }}
  CONTEXT_SKILLS_REQUIRE_REGION: {{ ternary "true" "false" .Values.requireRegion | quote }}
  {{- if eq .Values.deploymentMode "air-gapped" }}
  CONTEXT_SKILLS_BLOCK_EXTERNAL_TELEMETRY: "true"
  {{- end }}
  CONTEXT_SKILLS_OPA_URL: {{ if and .Values.opa.enabled .Values.opa.sidecar }}{{ .Values.opa.url | quote }}{{ else }}{{ .Values.opa.url | default "http://context-skills-opa:8181" | quote }}{{ end }}
  CONTEXT_SKILLS_CONSOLE: {{ ternary "enabled" "disabled" .Values.console.enabled | quote }}
  CONTEXT_SKILLS_APPROVAL_REQUIRED: "skills:publish,tenants:manage"
  CONTEXT_SKILLS_POLICY_BUNDLE_VERSION: "3.0.0"
  {{- if .Values.database.url }}
  CONTEXT_SKILLS_DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if .Values.saml.entityId }}
  CONTEXT_SKILLS_SAML_ENTITY_ID: {{ .Values.saml.entityId | quote }}
  {{- end }}
  {{- if .Values.saml.metadataUrl }}
  CONTEXT_SKILLS_SAML_METADATA_URL: {{ .Values.saml.metadataUrl | quote }}
  {{- end }}
  {{- if .Values.saml.acsUrl }}
  CONTEXT_SKILLS_SAML_ACS_URL: {{ .Values.saml.acsUrl | quote }}
  {{- end }}
  {{- if .Values.otel.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_TRACES_EXPORTER: otlp
  {{- end }}
  {{- if .Values.oidc.issuer }}
  CONTEXT_SKILLS_OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  CONTEXT_SKILLS_OIDC_AUDIENCE: {{ .Values.oidc.audience | quote }}
  {{- end }}
