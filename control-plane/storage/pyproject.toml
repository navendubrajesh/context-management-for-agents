[project]
name = "context-storage"
version = "3.0.0"
description = "Postgres/SQLite persistence for context-skills control plane"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_storage*"]
