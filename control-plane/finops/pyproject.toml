[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-finops"
version = "1.0.0"
description = "FinOps quotas, rate limits, and chargeback for context-management-for-agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["context_finops*"]
