[project]
name = "context-adapters-langgraph"
version = "3.0.0"
description = "LangGraph adapter nodes for context-skills primitives"
requires-python = ">=3.11"
dependencies = [
  "context-skills-core",
  "context-skills-sdk",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_adapters_langgraph*"]
