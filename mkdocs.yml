site_name: Context Management for Agents
site_description: Multi-platform Agent Skills and runtime for context engineering
site_url: https://navendubrajesh.github.io/context-management-for-agents/
repo_url: https://github.com/navendubrajesh/context-management-for-agents
repo_name: navendubrajesh/context-management-for-agents

theme:
  name: material
  font:
    text: DM Sans
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Skills catalog: skills/index.md
  - Runtime: runtime.md
  - Benchmarks: benchmarks.md
  - Architecture: architecture.md
  - Enterprise: ENTERPRISE.md
  - Using with GStack: using-with-gstack.md
  - Roadmap: roadmap.md
  - Runbook: RUNBOOK.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

docs_dir: docs
